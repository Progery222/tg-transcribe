services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    # Run as botuser (1001:999) so files in the shared volume are readable
    # from the `bot` container without permission games. We override the image
    # entrypoint to skip its root-only chown + --username flag (the binary
    # would refuse to setuid when already non-root).
    user: "1001:999"
    entrypoint: ["telegram-bot-api"]
    command:
      - "--dir=/var/lib/telegram-bot-api"
      - "--temp-dir=/var/lib/telegram-bot-api/.tmp"
      - "--local"
      - "--http-port=8081"
      - "--http-stat-port=8082"
      - "--verbosity=1"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    profiles: ["big-files"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    image: ghcr.io/progery222/tg-transcribe:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    volumes:
      - bot_data:/app/data
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
  telegram_bot_api_data:
