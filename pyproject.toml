[project]
name = "tg-transcribe"
version = "0.1.0"
description = "Telegram group bot: auto-transcribe voice and video notes via OpenAI / Gemini"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4.0",
    "openai>=1.54,<2.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "aiosqlite>=0.20,<0.22",
    "structlog>=24.4,<25.0",
    "tenacity>=9.0,<10.0",
    "httpx>=0.27,<0.29",
    "apscheduler>=3.10,<4.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-mock>=3.14,<4.0",
    "respx>=0.21,<0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
