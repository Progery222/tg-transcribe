# Coolify deployment for tg-transcribe (runner-free; bot built from Dockerfile).
# Outbound Telegram bot — no inbound port. Self-hosted telegram-bot-api for >20MB files.
# Coolify-managed volumes (NOT external — Coolify ignores `external:` and would make
# fresh root-owned volumes). A one-shot init step chowns them to the botuser
# (1001:999) so the non-root telegram-bot-api can write (its entrypoint is overridden
# to skip the image's root-only chown). Prod data is copied into these volumes at
# cutover; this init re-chowns the copied files.
services:
  init-perms:
    image: alpine:3
    user: "0:0"
    command: ["sh", "-c", "chown -R 1001:999 /bot_data /tba_data"]
    volumes:
      - bot_data:/bot_data
      - telegram_bot_api_data:/tba_data
    restart: "no"

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    depends_on:
      init-perms:
        condition: service_completed_successfully
    # Run as botuser (1001:999) so files in the shared volume are readable by `bot`.
    user: "1001:999"
    entrypoint: ["telegram-bot-api"]
    command:
      - "--dir=/var/lib/telegram-bot-api"
      - "--temp-dir=/var/lib/telegram-bot-api/.tmp"
      - "--local"
      - "--http-port=8081"
      - "--http-stat-port=8082"
      - "--verbosity=1"
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: tg-transcribe-app:latest
    restart: unless-stopped
    depends_on:
      init-perms:
        condition: service_completed_successfully
    env_file:
      - .env
    volumes:
      - bot_data:/app/data
      - telegram_bot_api_data:/var/lib/telegram-bot-api:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot_data:
  telegram_bot_api_data:
